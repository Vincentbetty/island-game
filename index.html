<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>岛屿大冒险 · 四人策略游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --brand: #4ade80; --warn: #f87171; --gold: #fbbf24;
  }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 12px; display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; text-align: center; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    margin-bottom: 12px; background: var(--panel); padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--line); max-width: 960px; width: 100%;
  }
  .turn-badge {
    font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 10px;
    background: #0b1220; border: 1px solid var(--line); white-space: nowrap;
  }
  .turn-badge b { color: var(--gold); }
  .dice-box { display: flex; align-items: center; gap: 8px; }
  .dice-val {
    width: 40px; height: 40px; border-radius: 8px; background: #0b1220;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: var(--gold);
  }
  .btn {
    padding: 8px 14px; font-size: 14px; font-weight: 600; border: none; border-radius: 9px;
    cursor: pointer; background: var(--brand); color: #0f172a; transition: .12s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.warn { background: var(--warn); color: #0f172a; }
  .btn.blue { background: #3b82f6; color: #fff; }
  .hint { font-size: 12px; color: var(--dim); }

  .main { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; justify-content: center; max-width: 960px; width: 100%; }
  .canvas-wrap { flex: 0 0 auto; }
  canvas {
    background: #1e293b; border-radius: 10px;
    box-shadow: 0 0 0 2px var(--line), 0 10px 30px rgba(0,0,0,.5);
    max-width: 100%; height: auto; cursor: pointer; display: block;
  }
  .side { flex: 1 1 300px; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }

  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; transition: .15s;
  }
  .pcard.active { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(74,222,128,.25); }
  .pcard.dead { opacity: .45; }
  .pcard .head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-weight: 700; }
  .pcard .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .pcard .dead-tag { color: var(--warn); font-size: 11px; margin-left: auto; }
  .pcard .row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; }
  .pcard .row .lab { color: var(--muted); }
  .pcard .row .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hpbar { height: 7px; border-radius: 4px; background: #0b1220; overflow: hidden; margin-top: 3px; }
  .hpbar i { display: block; height: 100%; background: var(--brand); transition: width .2s; }
  .pcard .weps { color: var(--muted); font-size: 12px; margin-top: 5px; min-height: 16px; }

  .log {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; color: var(--muted); height: 120px; overflow-y: auto;
    line-height: 1.6;
  }
  .log div b { color: var(--text); }

  .attackbar {
    display: none; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    background: rgba(248,113,113,.12); border: 1px solid var(--warn);
    padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; width: 100%; max-width: 960px;
  }
  .attackbar.show { display: flex; }
  .attackbar .lbl { color: var(--warn); font-weight: 700; font-size: 14px; }
  .wep-btn {
    padding: 7px 12px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer;
    background: #0b1220; color: var(--text); border: 1px solid var(--line);
  }
  .wep-btn.sel { border-color: var(--warn); color: var(--warn); }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal.hidden, .overlay.hidden { display: none; }
  .modal .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto;
  }
  .modal h2 { font-size: 17px; margin-bottom: 12px; }
  .shop-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    background: #0b1220; border: 1px solid var(--line); margin-bottom: 8px;
  }
  .shop-item .name { font-weight: 700; min-width: 64px; }
  .shop-item .meta { color: var(--muted); font-size: 12px; flex: 1; }
  .shop-item .owned { color: var(--gold); font-size: 12px; }
  .shop-item .cost { color: var(--brand); font-weight: 700; white-space: nowrap; }

  .chg-ver { font-size: 15px; font-weight: 700; color: var(--gold); margin: 12px 0 4px; }
  .chg-ver:first-child { margin-top: 0; }
  .chg-date { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .chg-list { list-style: none; padding: 0; margin: 0 0 6px; }
  .chg-list li { font-size: 13px; color: var(--text); padding: 3px 0 3px 16px; position: relative; line-height: 1.55; }
  .chg-list li::before { content: '·'; position: absolute; left: 4px; color: var(--brand); font-weight: 700; }

  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.88); z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .overlay h2 { font-size: 30px; color: var(--gold); }
  .overlay p { color: var(--muted); font-size: 15px; }

  .player-select { display: flex; gap: 10px; align-items: center; margin: 4px 0 10px; }
  .ps-label { color: var(--muted); font-size: 14px; }
  .player-select .btn { padding: 8px 20px; font-size: 15px; }
  .player-select .btn.sel { background: var(--brand); color: #0f172a; border-color: var(--brand); }

  .legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 13px; height: 13px; border-radius: 3px; display: inline-block; }

  .footer { margin-top: 10px; text-align: center; }
  .link-btn {
    background: none; border: none; color: var(--dim); font-size: 11px;
    cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: .12s;
  }
  .link-btn:hover { color: var(--muted); text-decoration: underline; }

  /* 开局坠落动画 */
  .intro { position: fixed; inset: 0; z-index: 70; overflow: hidden; pointer-events: none; }
  .intro.hidden { display: none; }
  .intro .sky { position: absolute; inset: 0; background: linear-gradient(#38bdf8 0%, #93c5fd 45%, #e0f2fe 100%); }
  .intro .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .85; }
  .intro .cloud::before, .intro .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .intro .c1 { width: 180px; height: 56px; top: 22%; left: -60px; animation: cloudDrift 3s linear infinite; }
  .intro .c1::before { width: 70px; height: 70px; left: 30px; top: -34px; }
  .intro .c1::after { width: 90px; height: 90px; left: 80px; top: -40px; }
  .intro .c2 { width: 150px; height: 46px; top: 46%; right: -60px; animation: cloudDrift 4s linear infinite reverse; }
  .intro .c2::before { width: 60px; height: 60px; left: 30px; top: -30px; }
  .intro .c3 { width: 130px; height: 40px; top: 68%; left: 20%; animation: cloudDrift 3.5s linear infinite; }
  .intro .c3::before { width: 50px; height: 50px; left: 30px; top: -26px; }
  @keyframes cloudDrift { from { transform: translateX(-80px); } to { transform: translateX(130vw); } }
  .intro .faller {
    position: absolute; left: 50%; top: 0; width: 56px; height: 56px; margin-left: -28px;
    background: #ef4444; border-radius: 50%; border: 3px solid #b91c1c;
    box-shadow: 0 10px 22px rgba(0,0,0,.35);
  }
  .intro.play .sky { animation: skyFall 1.3s ease-in forwards; }
  .intro.play .faller { animation: figureDrop 1.3s ease-in forwards; }
  @keyframes skyFall {
    0% { transform: translateY(0); opacity: 1; }
    60% { opacity: 1; }
    100% { transform: translateY(115%); opacity: 0; }
  }
  @keyframes figureDrop {
    0% { transform: translateY(-80px) scale(1); }
    50% { transform: translateY(40vh) scale(1.05); }
    100% { transform: translateY(40vh) scale(.85); opacity: 0; }
  }

  /* 挖矿资源弹窗 */
  .resource-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.5);
    z-index: 80; pointer-events: none; text-align: center; opacity: 0;
  }
  .resource-toast.show { animation: rtPop 1.3s ease forwards; }
  .rt-shape { width: 150px; height: 150px; margin: 0 auto; filter: drop-shadow(0 0 26px rgba(255,255,255,.5)); }
  .rt-shape svg { width: 100%; height: 100%; }
  .rt-name { font-size: 30px; font-weight: 800; color: #fff; margin-top: 8px; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  .rt-value { font-size: 20px; color: var(--gold); font-weight: 700; margin-top: 4px; }
  @keyframes rtPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    30% { transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05) translateY(-30px); }
  }

  @media (max-width: 720px) {
    .players { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <h1>岛屿大冒险</h1>
  <p class="sub">20 × 15 网格 · 掷骰子移动 · 挖矿赚钱 · 购买武器互相攻击 · 最后存活者获胜 · <b id="verLabel" style="color:var(--gold)"></b></p>

  <div class="controls">
    <div class="turn-badge">当前回合：<b id="turnName">玩家1</b></div>
    <div class="dice-box">
      <button class="btn blue" id="rollBtn">掷骰子</button>
      <div class="dice-val" id="diceVal">-</div>
      <span class="hint" id="moveHint">尚未掷骰子</span>
    </div>
    <button class="btn" id="digBtn">挖掘（-1 行动力）</button>
    <button class="btn" id="buyBtn">购买</button>
    <button class="btn warn" id="attackBtn">攻击（-1 行动力）</button>
    <button class="btn ghost" id="endBtn">结束回合</button>
  </div>

  <div class="attackbar" id="attackBar">
    <span class="lbl">选择武器，然后点击地图上的敌人：</span>
    <span id="wepBtns"></span>
    <button class="btn ghost" id="cancelAttack">取消攻击</button>
  </div>

  <div class="main">
    <div class="canvas-wrap">
      <canvas id="map"></canvas>
    </div>
    <div class="side">
      <div class="players" id="playersPanel"></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="footer">
    <button class="link-btn" id="changelogBtn">更新日志</button>
  </div>

  <!-- 购买弹窗 -->
  <div class="modal hidden" id="buyModal">
    <div class="box">
      <h2 id="buyTitle">购买</h2>
      <div id="shopList"></div>
      <button class="btn ghost" id="closeBuy" style="width:100%;margin-top:6px">关闭</button>
    </div>
  </div>

  <!-- 更新日志弹窗 -->
  <div class="modal hidden" id="changelogModal">
    <div class="box">
      <h2>更新日志</h2>
      <div id="changelogList"></div>
      <button class="btn ghost" id="closeChangelog" style="width:100%;margin-top:6px">关闭</button>
    </div>
  </div>

  <!-- 开始弹窗 -->
  <div class="overlay" id="startOverlay">
    <h2>岛屿大冒险</h2>
    <p>本地轮流 · 掷骰子移动 · 挖矿赚钱 · 购买武器 · 最后存活者获胜</p>
    <div class="player-select" id="playerSelect">
      <span class="ps-label">玩家数量</span>
      <button class="btn ghost sel" data-n="4">4 人</button>
      <button class="btn ghost" data-n="3">3 人</button>
      <button class="btn ghost" data-n="2">2 人</button>
    </div>
    <button class="btn" id="startBtn" style="font-size:16px;padding:12px 30px">开始游戏</button>
  </div>

  <!-- 胜利弹窗 -->
  <div class="overlay hidden" id="winOverlay">
    <h2 id="winTitle"></h2>
    <p id="winMsg"></p>
    <button class="btn" id="restartBtn" style="font-size:16px;padding:12px 30px">重新开始</button>
  </div>

  <!-- 开局坠落动画 -->
  <div class="intro hidden" id="introOverlay">
    <div class="sky"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="faller" id="introFaller"></div>
  </div>

  <!-- 挖矿资源弹窗 -->
  <div class="resource-toast" id="resourceToast">
    <div class="rt-shape" id="resourceShape"></div>
    <div class="rt-name" id="resourceName"></div>
    <div class="rt-value" id="resourceValue"></div>
  </div>

<script>
(() => {
  const W = 20, H = 15, CELL = 19.2;
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  canvas.width = W * CELL;
  canvas.height = H * CELL;

  const OCEAN = '#3b82c4';      // 海洋（水域，挖矿概率最低）
  const ISLAND = '#6fbf73';     // 中央岛屿（挖矿概率中）

  // ---------- 版本与更新日志 ----------
  const VERSION = '1.2.1';
  // 更新日志：每次更新请在最前面（数组顶部）新增一条记录
  const CHANGELOG = [
    {
      version: '1.2.1',
      date: '2026-11-08',
      title: '下调大海挖掘概率',
      items: [
        '大海（海面）资源产出概率再降低 10%',
      ],
    },
    {
      version: '1.2.0',
      date: '2026-11-08',
      title: '地图优化与岛屿装饰',
      items: [
        '地图整体缩小 1/5',
        '更新日志按钮移到页面底部，弱化显示',
        '中央岛屿新增椰树、火山等装饰',
      ],
    },
    {
      version: '1.1.0',
      date: '2026-11-08',
      title: '新增回血机制',
      items: [
        '商店新增「生命之泉」：8 万恢复 1 点生命值，最多到 10 点',
        '每回合最多购买 3 次生命之泉',
      ],
    },
    {
      version: '1.0.1',
      date: '2026-11-08',
      title: '调整挖掘概率',
      items: [
        '出生地改为高概率，中央岛屿改为中概率，海面保持低概率',
      ],
    },
    {
      version: '1.0.0',
      date: '2026-11-08',
      title: '首个正式版本',
      items: [
        '完成游戏核心循环：掷骰子移动、挖矿赚钱、购买武器、互相攻击、最后存活者获胜',
        '支持 2 / 3 / 4 人局，默认 4 人',
        '开局从天而降的坠落动画',
        '角色模型与走路摆动动画',
        '矿镐挥动挖矿动画',
        '挖到不同资源时屏幕中央展示对应资源模型',
        '不同武器对应攻击特效（挥砍 / 爆炸 / 弹道 / 炮弹）',
        '全套合成音效：开局、掷骰、移动、挖掘、购买、攻击、扣血、回合切换、胜利庆祝',
        '优化宝石出产率',
        '调整武器攻击距离（斧头1 / 手榴弹2 / 枪3 / 大炮5）',
      ],
    },
  ];

  // 资源（对应货币，单位：万）
  const RESOURCES = [
    { name: '煤矿', value: 1, color: '#94a3b8' },
    { name: '铜矿', value: 2, color: '#d97706' },
    { name: '榴石', value: 3, color: '#ef4444' },
    { name: '宝石', value: 4, color: '#10b981' },
    { name: '水晶', value: 5, color: '#38bdf8' },
    { name: '钻石', value: 6, color: '#67e8f9' },
  ];

  // 武器系统：成本(万) / 攻击距离(格) / 攻击力
  const WEAPONS = [
    { name: '斧头',   cost: 5,  range: 1, dmg: 1 },
    { name: '手榴弹', cost: 10, range: 2, dmg: 2 },
    { name: '枪',     cost: 15, range: 3, dmg: 3 },
    { name: '大炮',   cost: 30, range: 5, dmg: 5 },
  ];

  const BREAD = { name: '面包', cost: 1, ap: 2 };  // 1万恢复2点行动力
  const HEAL = { name: '生命之泉', cost: 8, hp: 1, max: 10, perTurn: 3 };  // 8万回1点生命，每回合限购3次

  // 四个出生地（四角，顺时针）：左上 → 右上 → 右下 → 左下
  // bx0/by0 ~ bx1/by1 为 3×3 出生地；出生点即水晶所在角落
  const BASE_SPOTS = [
    { x: 0,  y: 0,  bx0: 0,  by0: 0,  bx1: 2,  by1: 2,  color: '#ef4444', dark: '#b91c1c' },
    { x: 19, y: 0,  bx0: 17, by0: 0,  bx1: 19, by1: 2,  color: '#3b82f6', dark: '#1d4ed8' },
    { x: 19, y: 14, bx0: 17, by0: 12, bx1: 19, by1: 14, color: '#a855f7', dark: '#7e22ce' },
    { x: 0,  y: 14, bx0: 0,  by0: 12, bx1: 2,  by1: 14, color: '#f59e0b', dark: '#b45309' },
  ];
  let players = [];
  function setupPlayers(count) {
    // 2人取对角，3人取三角，4人取四角
    const order = count === 2 ? [0, 2] : count === 3 ? [0, 1, 2] : [0, 1, 2, 3];
    players = order.map((spotIdx, i) => ({
      name: '玩家' + (i + 1),
      color: BASE_SPOTS[spotIdx].color,
      dark: BASE_SPOTS[spotIdx].dark,
      x: BASE_SPOTS[spotIdx].x, y: BASE_SPOTS[spotIdx].y,
      bx0: BASE_SPOTS[spotIdx].bx0, by0: BASE_SPOTS[spotIdx].by0,
      bx1: BASE_SPOTS[spotIdx].bx1, by1: BASE_SPOTS[spotIdx].by1,
      money: 0, ap: 5, hp: 10, weapons: [0, 0, 0, 0], alive: true, takenTurn: false, healBuys: 0,
      px: BASE_SPOTS[spotIdx].x * CELL + CELL / 2,
      py: BASE_SPOTS[spotIdx].y * CELL + CELL / 2,
      moving: false, legPhase: 0, mineAnim: 0,
    }));
    renderLegend();
  }
  setupPlayers(4); // 默认四人，先渲染出棋盘

  // 每个格子的挖掘状态
  const board = [];
  for (let y = 0; y < H; y++) {
    board[y] = [];
    for (let x = 0; x < W; x++) board[y][x] = { dug: false, resource: null };
  }

  // 游戏状态
  let current = 0;
  let phase = 'awaitRoll';   // awaitRoll | acting | attack
  let diceValue = 0;
  let moveLeft = 0;
  let selectedWeapon = 0;
  let gameOver = false;
  let winner = null;

  // ---------- 地图地形 ----------
  function isIsland(x, y) {
    const dx = (x - 9.5) / 6;
    const dy = (y - 7) / 4;
    return dx * dx + dy * dy <= 1;
  }
  function ownerOfBase(x, y) {
    for (const p of players) {
      if (x >= p.bx0 && x <= p.bx1 && y >= p.by0 && y <= p.by1) return p;
    }
    return null;
  }
  function terrain(x, y) {
    if (ownerOfBase(x, y)) return 'base';
    if (isIsland(x, y)) return 'island';
    return 'ocean';
  }

  // ---------- 挖矿：按地形不同概率 ----------
  function rollResource(x, y) {
    const t = terrain(x, y);
    let find, weights; // 权重对应 [煤,铜,榴石,宝石,水晶,钻石]
    if (t === 'base')        { find = 0.85; weights = [10, 15, 20, 35, 12,  8]; }
    else if (t === 'island') { find = 0.65; weights = [25, 28, 15, 22,  7,  3]; }
    else                     { find = 0.35; weights = [50, 26,  8, 12,  3,  1]; }
    if (Math.random() > find) return null;
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r < 0) return RESOURCES[i];
    }
    return RESOURCES[RESOURCES.length - 1];
  }

  function darken(hex, f = 0.5) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
    return `rgb(${r},${g},${b})`;
  }

  // ---------- 距离（切比雪夫距离，即“格”数） ----------
  function dist(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
  function isAdjacent(x, y, px, py) { return Math.max(Math.abs(x - px), Math.abs(y - py)) === 1; }

  // ---------- 日志 ----------
  const logEl = document.getElementById('log');
  function log(msg) {
    const div = document.createElement('div');
    div.innerHTML = msg;
    logEl.prepend(div);
    while (logEl.children.length > 60) logEl.removeChild(logEl.lastChild);
  }

  // ---------- 音效系统（Web Audio 合成） ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, dur = 0.12, type = 'sine', vol = 0.2, slide = 0) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + dur + 0.02);
  }
  function noiseBurst(dur = 0.15, vol = 0.25) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(g).connect(ctx.destination);
    src.start();
  }
  function sfx(name, arg) {
    switch (name) {
      case 'start':
        tone(523, 0.12, 'sine', 0.22);
        setTimeout(() => tone(659, 0.12, 'sine', 0.22), 90);
        setTimeout(() => tone(784, 0.2, 'sine', 0.22), 180);
        break;
      case 'turn':     tone(392, 0.1, 'triangle', 0.18); break;
      case 'dice':
        noiseBurst(0.08, 0.2);
        setTimeout(() => noiseBurst(0.1, 0.18), 80);
        break;
      case 'move':     tone(240, 0.05, 'square', 0.08); break;
      case 'dig':
        noiseBurst(0.12, 0.3);
        tone(110, 0.12, 'sine', 0.16, -40);
        break;
      case 'buy':
        tone(880, 0.09, 'sine', 0.18);
        setTimeout(() => tone(1318, 0.12, 'sine', 0.15), 70);
        break;
      case 'hurt':
        tone(180, 0.2, 'sawtooth', 0.22, -90);
        noiseBurst(0.1, 0.15);
        break;
      case 'endTurn':  tone(300, 0.08, 'triangle', 0.14); break;
      case 'win': {
        const notes = [523, 659, 784, 1047, 784, 1047, 1318];
        notes.forEach((f, i) => setTimeout(() => tone(f, 0.2, 'sine', 0.22), i * 120));
        setTimeout(() => { tone(1318, 0.6, 'sine', 0.24); tone(1047, 0.6, 'triangle', 0.16); }, notes.length * 120);
        break;
      }
      case 'resource': {
        const f = [180, 260, 430, 1047, 1318, 1760][arg] || 600;
        tone(f, 0.16, 'sine', 0.2, f * 0.3);
        if (arg >= 3) setTimeout(() => tone(f * 1.5, 0.18, 'sine', 0.18), 90);
        break;
      }
      case 'weapon': {
        if (arg === 0) { tone(150, 0.1, 'sawtooth', 0.22, -70); }
        else if (arg === 1) { noiseBurst(0.2, 0.35); tone(90, 0.18, 'sine', 0.22, -40); }
        else if (arg === 2) { tone(700, 0.08, 'square', 0.22, -500); noiseBurst(0.06, 0.2); }
        else { noiseBurst(0.3, 0.4); tone(70, 0.28, 'sine', 0.25, -40); }
        break;
      }
    }
  }

  // ---------- 回合流程 ----------
  function startTurn() {
    const p = players[current];
    if (p.takenTurn) p.ap += 1;   // 每回合自动获取 1 点行动力
    p.takenTurn = true;
    p.healBuys = 0;
    diceValue = 0; moveLeft = 0; phase = 'awaitRoll'; selectedWeapon = 0;
    log(`—— <b>${p.name}</b> 的回合（每回合行动力 +1）——`);
    sfx('turn');
    render();
  }

  function roll() {
    if (phase !== 'awaitRoll' || gameOver) return;
    diceValue = Math.floor(Math.random() * 6) + 1;
    moveLeft = diceValue;
    phase = 'acting';
    log(`${players[current].name} 掷出了 <b>${diceValue}</b> 点`);
    sfx('dice');
    render();
  }

  function moveTo(x, y) {
    const p = players[current];
    if (phase !== 'acting' || moveLeft <= 0) return;
    if (!isAdjacent(x, y, p.x, p.y)) return;
    p.x = x; p.y = y; moveLeft--;
    log(`${p.name} 移动到 (${x}, ${y})，剩余步数 ${moveLeft}`);
    sfx('move');
    render();
  }

  function dig() {
    if (phase !== 'acting' || gameOver) return;
    const p = players[current];
    const cell = board[p.y][p.x];
    if (cell.dug) { log('这个格子已经挖过了'); return; }
    if (p.ap < 1) { log('行动力不足'); return; }
    p.ap -= 1;
    cell.dug = true;
    p.mineAnim = 1;
    sfx('dig');
    const r = rollResource(p.x, p.y);
    if (r) {
      p.money += r.value;
      cell.resource = r;
      log(`${p.name} 挖到了 <b style="color:${r.color}">${r.name}</b>（+${r.value} 万）`);
      sfx('resource', RESOURCES.indexOf(r));
      showResourceToast(r);
    } else {
      log(`${p.name} 什么都没挖到`);
    }
    render();
  }

  function buyWeapon(i) {
    if (gameOver) return;
    const p = players[current];
    const w = WEAPONS[i];
    if (p.money < w.cost) { log('货币不足'); return; }
    p.money -= w.cost;
    p.weapons[i]++;
    log(`${p.name} 购买了 <b>${w.name}</b>（-${w.cost} 万）`);
    sfx('buy');
    render();
  }

  function buyBread() {
    if (gameOver) return;
    const p = players[current];
    if (p.money < BREAD.cost) { log('货币不足'); return; }
    p.money -= BREAD.cost;
    p.ap += BREAD.ap;
    log(`${p.name} 购买了 <b>面包</b>（-${BREAD.cost} 万，行动力 +${BREAD.ap}）`);
    sfx('buy');
    render();
  }

  function buyHeal() {
    if (gameOver) return;
    const p = players[current];
    if (p.hp >= HEAL.max) { log('生命值已满，无需恢复'); return; }
    if (p.healBuys >= HEAL.perTurn) { log(`每回合最多只能购买 ${HEAL.perTurn} 次生命之泉`); return; }
    if (p.money < HEAL.cost) { log('货币不足'); return; }
    p.money -= HEAL.cost;
    p.healBuys++;
    p.hp = Math.min(HEAL.max, p.hp + HEAL.hp);
    log(`${p.name} 购买了 <b>生命之泉</b>（-${HEAL.cost} 万，生命 +${HEAL.hp}，当前 ${p.hp}/${HEAL.max}）`);
    sfx('buy');
    render();
    openShop();   // 刷新商店，更新生命值与限购次数
  }

  function toggleAttack() {
    if (gameOver) return;
    const p = players[current];
    if (phase === 'attack') { phase = 'acting'; render(); return; }
    if (phase !== 'acting') return;
    if (p.weapons.every(c => c === 0)) { log('还没有武器，无法攻击'); return; }
    selectedWeapon = p.weapons.findIndex(c => c > 0);
    phase = 'attack';
    log(`${p.name} 进入攻击模式，选择武器并点击敌人`);
    render();
  }

  function selectWeapon(i) {
    selectedWeapon = i;
    render();
  }

  function doAttack(target) {
    const p = players[current];
    const w = WEAPONS[selectedWeapon];
    const d = dist(p, target);
    if (d > w.range) { log(`${target.name} 不在 ${w.name} 的攻击范围内`); return; }
    if (p.ap < 1) { log('行动力不足'); return; }
    if (p.weapons[selectedWeapon] <= 0) { log('没有该武器'); return; }
    p.ap -= 1;
    p.weapons[selectedWeapon]--;   // 武器一次性使用，使用后消耗
    target.hp -= w.dmg;
    log(`${p.name} 用 <b>${w.name}</b> 攻击 ${target.name}，造成 <b>${w.dmg}</b> 点伤害（该武器已消耗）`);
    spawnAttackEffects(p, target, selectedWeapon);
    sfx('weapon', selectedWeapon);
    sfx('hurt');
    if (target.hp <= 0) {
      target.hp = 0; target.alive = false;
      log(`<b>${target.name} 生命值归零，游戏结束！</b>`);
      checkWin();
    }
    phase = 'acting';
    render();
  }

  function checkWin() {
    const alive = players.filter(p => p.alive);
    if (alive.length <= 1) {
      gameOver = true;
      winner = alive[0] || null;
      document.getElementById('winTitle').textContent = winner ? `${winner.name} 获胜！` : '平局';
      document.getElementById('winMsg').textContent = '所有其他玩家都已被淘汰';
      document.getElementById('winOverlay').classList.remove('hidden');
      sfx('win');
    }
  }

  function endTurn() {
    if (gameOver) return;
    const n = players.length;
    let next = current;
    for (let i = 1; i <= n; i++) {
      const idx = (current + i) % n;
      if (players[idx].alive) { next = idx; break; }
    }
    current = next;
    phase = 'ended';
    sfx('endTurn');
    startTurn();
  }

  // ---------- 动画 & 渲染 ----------
  const effects = [];
  let shake = 0;
  let lastTs = 0, rafId = null, dirty = true;

  // 资源模型（SVG，用于大屏幕中间弹窗）
  const RESOURCE_SVG = [
    '<svg viewBox="0 0 100 100"><polygon points="20,80 15,45 40,25 70,30 85,55 75,80 45,85" fill="#64748b"/><polygon points="20,80 45,85 40,25 15,45" fill="#475569"/></svg>',
    '<svg viewBox="0 0 100 100"><polygon points="25,75 20,50 45,30 75,40 80,70 55,85" fill="#d97706"/><polygon points="25,75 55,85 45,30 20,50" fill="#92400e"/></svg>',
    '<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="30" fill="#ef4444"/><polygon points="35,45 50,20 65,45 50,70" fill="#fca5a5"/></svg>',
    '<svg viewBox="0 0 100 100"><polygon points="35,20 65,20 70,80 30,80" fill="#10b981"/><polygon points="35,20 50,20 50,80 30,80" fill="#34d399"/><polygon points="30,80 50,80 50,95 25,90" fill="#047857"/></svg>',
    '<svg viewBox="0 0 100 100"><polygon points="50,15 70,45 50,85 30,45" fill="#38bdf8"/><polygon points="50,15 60,45 50,85 40,45" fill="#bae6fd"/></svg>',
    '<svg viewBox="0 0 100 100"><polygon points="50,10 80,35 50,90 20,35" fill="#67e8f9"/><polygon points="50,10 80,35 50,50 20,35" fill="#e0f2fe"/><polygon points="20,35 50,50 50,90" fill="#7dd3fc"/><polygon points="80,35 50,50 50,90" fill="#38bdf8"/></svg>',
  ];

  function updateAnim(dt) {
    players.forEach(pl => {
      const tx = pl.x * CELL + CELL / 2, ty = pl.y * CELL + CELL / 2;
      const dx = tx - pl.px, dy = ty - pl.py;
      const d = Math.hypot(dx, dy);
      if (d > 0.5) {
        pl.moving = true;
        const step = Math.min(d, CELL * 11 * dt);
        pl.px += dx / d * step;
        pl.py += dy / d * step;
        pl.legPhase += dt * 13;
      } else {
        pl.px = tx; pl.py = ty; pl.moving = false; pl.legPhase = 0;
      }
      if (pl.mineAnim > 0) pl.mineAnim = Math.max(0, pl.mineAnim - dt / 0.4);
    });
    for (let i = effects.length - 1; i >= 0; i--) {
      effects[i].t += dt;
      if (effects[i].t >= effects[i].dur) effects.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 28);
  }

  // ---------- 岛屿装饰（椰树、火山等） ----------
  const DECORATIONS = [
    { type: 'volcano', x: 10.0, y: 4.0 },
    { type: 'palm', x: 5.0, y: 6.6 },
    { type: 'palm', x: 6.8, y: 9.2 },
    { type: 'palm', x: 12.4, y: 5.8 },
    { type: 'palm', x: 13.6, y: 8.6 },
    { type: 'palm', x: 11.4, y: 10.4 },
    { type: 'palm', x: 7.8, y: 4.4 },
  ];

  function drawPalm(px, py) {
    const u = CELL * 0.24;
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = u * 1.1; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py + u * 2.4);
    ctx.quadraticCurveTo(px + u * 1.2, py - u * 0.4, px + u * 0.4, py - u * 3.4);
    ctx.stroke();
    ctx.fillStyle = '#34a853';
    for (let i = -2; i <= 2; i++) {
      const a = -Math.PI / 2 + i * 0.48;
      ctx.beginPath();
      ctx.ellipse(px + u * 0.4 + Math.cos(a) * u * 3.1, py - u * 3.4 + Math.sin(a) * u * 1.6, u * 3.1, u * 1.1, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#6d4c2a';
    ctx.beginPath(); ctx.arc(px + u * 1.3, py - u * 2.7, u * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px - u * 0.3, py - u * 2.3, u * 0.8, 0, Math.PI * 2); ctx.fill();
  }

  function drawVolcano(px, py) {
    const u = CELL * 0.24;
    ctx.fillStyle = '#6b5a4c';
    ctx.beginPath();
    ctx.moveTo(px - u * 4.2, py + u * 3.2);
    ctx.lineTo(px - u * 1.7, py - u * 2.6);
    ctx.lineTo(px + u * 1.7, py - u * 2.6);
    ctx.lineTo(px + u * 4.2, py + u * 3.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a3f35';
    ctx.beginPath();
    ctx.moveTo(px - u * 1.7, py - u * 2.6);
    ctx.lineTo(px + u * 1.7, py - u * 2.6);
    ctx.lineTo(px, py - u * 4.0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5a3c';
    ctx.beginPath(); ctx.ellipse(px, py - u * 3.1, u * 1.3, u * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.ellipse(px, py - u * 3.1, u * 0.7, u * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawDecorations() {
    DECORATIONS.forEach(d => {
      const px = d.x * CELL, py = d.y * CELL;
      if (d.type === 'palm') drawPalm(px, py);
      else drawVolcano(px, py);
    });
  }

  function drawBoard(p) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const t = terrain(x, y);
      let fill = OCEAN;
      if (t === 'island') fill = ISLAND;
      else if (t === 'base') fill = ownerOfBase(x, y).color;
      if (board[y][x].dug) fill = darken(fill, 0.5);
      ctx.fillStyle = fill;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      if (board[y][x].dug && board[y][x].resource) {
        ctx.fillStyle = board[y][x].resource.color;
        ctx.beginPath(); ctx.arc(x * CELL + CELL - 5, y * CELL + 5, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    drawDecorations();
    if (phase === 'acting' && moveLeft > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = p.x + dx, ny = p.y + dy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) ctx.fillRect(nx * CELL, ny * CELL, CELL, CELL);
      }
    }
    if (phase === 'attack') {
      const w = WEAPONS[selectedWeapon];
      ctx.strokeStyle = 'rgba(248,113,113,.85)'; ctx.lineWidth = 2;
      players.forEach(q => {
        if (q.alive && q !== p && dist(p, q) <= w.range) {
          ctx.beginPath(); ctx.arc(q.x * CELL + CELL / 2, q.y * CELL + CELL / 2, CELL * 0.52, 0, Math.PI * 2); ctx.stroke();
        }
      });
    }
    ctx.strokeStyle = 'rgba(15,23,42,.25)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H * CELL); ctx.stroke(); }
    for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W * CELL, y * CELL); ctx.stroke(); }
    players.forEach(pl => {
      const cx = pl.bx0 * CELL + CELL / 2, cy = pl.by0 * CELL + CELL / 2, r = CELL * 0.34;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = pl.dark; ctx.lineWidth = 2; ctx.stroke();
    });
  }

  function drawCharacter(pl, i) {
    const cx = pl.px, cy = pl.py;
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(cx, cy + CELL * 0.34, CELL * 0.3, CELL * 0.09, 0, 0, Math.PI * 2); ctx.fill();

    if (!pl.alive) {
      ctx.fillStyle = '#334155';
      ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0b1220'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✕', cx, cy);
      return;
    }

    const r = CELL * 0.4;
    const active = (i === current && !gameOver);
    // 腿（走路摆动）
    const swing = pl.moving ? Math.sin(pl.legPhase) * CELL * 0.15 : 0;
    ctx.strokeStyle = pl.dark; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - CELL * 0.12, cy + r * 0.5); ctx.lineTo(cx - CELL * 0.12 + swing, cy + r + CELL * 0.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + CELL * 0.12, cy + r * 0.5); ctx.lineTo(cx + CELL * 0.12 - swing, cy + r + CELL * 0.12); ctx.stroke();
    // 身体
    ctx.fillStyle = pl.color;
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.1, r * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = active ? '#fff' : pl.dark;
    ctx.lineWidth = active ? 3 : 2;
    ctx.stroke();
    // 头
    ctx.fillStyle = '#fcd9b8';
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.95, r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1; ctx.stroke();
    // 编号
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), cx, cy - r * 0.1);

    // 挖矿动作：矿镐挥动
    if (pl.mineAnim > 0) {
      const prog = 1 - pl.mineAnim;
      ctx.save();
      ctx.translate(cx, cy - r * 0.1);
      ctx.rotate(-1.4 + prog * 1.9);
      ctx.strokeStyle = '#a16207'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(CELL * 0.75, 0); ctx.stroke();
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(CELL * 0.75, 0, CELL * 0.28, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlayers() {
    players.forEach((pl, i) => drawCharacter(pl, i));
  }

  function drawEffects() {
    effects.forEach(e => {
      const k = e.t / e.dur;
      if (e.type === 'slash') {
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(e.x, e.y, CELL * (0.3 + k * 1.0), e.angle - 0.9 + k * 1.8, e.angle - 0.9 + k * 1.8 + 1.9);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'projectile') {
        const x = e.x0 + (e.x1 - e.x0) * k;
        const y = e.y0 + (e.y1 - e.y0) * k - Math.sin(k * Math.PI) * CELL * 2;
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
      } else if (e.type === 'explosion') {
        const rr = e.maxR * (0.35 + 0.65 * k);
        ctx.save();
        ctx.globalAlpha = 1 - k;
        const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, rr);
        grd.addColorStop(0, '#fff7cc');
        grd.addColorStop(0.4, '#fbbf24');
        grd.addColorStop(1, 'rgba(248,113,113,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (e.type === 'tracer') {
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(e.x0, e.y0); ctx.lineTo(e.x1, e.y1); ctx.stroke();
        ctx.restore();
      } else if (e.type === 'spark') {
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = '#fff';
        for (let s = 0; s < 6; s++) {
          const a = s / 6 * Math.PI * 2;
          const rr = CELL * (0.1 + k * 0.55);
          ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr, 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    });
  }

  function drawCanvas() {
    const p = players[current];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
    drawBoard(p);
    drawPlayers();
    drawEffects();
    ctx.restore();
  }

  function loop(ts) {
    if (lastTs === 0) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    updateAnim(dt);
    drawCanvas();
    if (dirty) { renderPanels(); renderControls(); dirty = false; }
    rafId = requestAnimationFrame(loop);
  }

  function render() {
    dirty = true;
    if (rafId === null) {
      lastTs = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  function spawnAttackEffects(from, to, wi) {
    const x0 = from.px, y0 = from.py, x1 = to.px, y1 = to.py;
    if (wi === 0) {
      effects.push({ type: 'slash', t: 0, dur: 0.3, x: x1, y: y1, angle: Math.atan2(y1 - y0, x1 - x0) });
    } else if (wi === 1) {
      effects.push({ type: 'projectile', t: 0, dur: 0.5, x0, y0, x1, y1, color: '#16a34a', r: CELL * 0.16 });
      setTimeout(() => { effects.push({ type: 'explosion', t: 0, dur: 0.5, x: x1, y: y1, maxR: CELL * 1.7 }); shake = Math.max(shake, 6); }, 250);
    } else if (wi === 2) {
      effects.push({ type: 'tracer', t: 0, dur: 0.12, x0, y0, x1, y1 });
      effects.push({ type: 'spark', t: 0, dur: 0.2, x: x1, y: y1 });
      shake = Math.max(shake, 2);
    } else {
      effects.push({ type: 'projectile', t: 0, dur: 0.4, x0, y0, x1, y1, color: '#111827', r: CELL * 0.28 });
      setTimeout(() => { effects.push({ type: 'explosion', t: 0, dur: 0.7, x: x1, y: y1, maxR: CELL * 2.4 }); shake = Math.max(shake, 12); }, 200);
    }
  }

  function showResourceToast(r) {
    const toast = document.getElementById('resourceToast');
    const idx = RESOURCES.indexOf(r);
    document.getElementById('resourceShape').innerHTML = RESOURCE_SVG[idx] || '';
    const nameEl = document.getElementById('resourceName');
    nameEl.textContent = r.name;
    nameEl.style.color = r.color;
    document.getElementById('resourceValue').textContent = '+ ' + r.value + ' 万';
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 1300);
  }

  // ---------- 玩家面板 ----------
  function renderPanels() {
    const el = document.getElementById('playersPanel');
    el.innerHTML = '';
    players.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'pcard' + (i === current && !gameOver ? ' active' : '') + (!p.alive ? ' dead' : '');
      const weps = WEAPONS.map((w, wi) => p.weapons[wi] > 0 ? `${w.name}×${p.weapons[wi]}` : '').filter(Boolean).join('、');
      card.innerHTML = `
        <div class="head">
          <span class="dot" style="background:${p.color}"></span>
          ${p.name}
          ${!p.alive ? '<span class="dead-tag">已淘汰</span>' : ''}
        </div>
        <div class="row"><span class="lab">货币</span><span class="val">${p.money} 万</span></div>
        <div class="row"><span class="lab">行动力</span><span class="val">${p.ap}</span></div>
        <div class="row"><span class="lab">生命值</span><span class="val">${p.hp} / 10</span></div>
        <div class="hpbar"><i style="width:${Math.max(0, p.hp / 10 * 100)}%;background:${p.color}"></i></div>
        <div class="weps">${weps ? '武器：' + weps : '暂无武器'}</div>
      `;
      el.appendChild(card);
    });
  }

  // ---------- 控制按钮状态 ----------
  function renderControls() {
    document.getElementById('turnName').textContent = players[current].name;
    document.getElementById('turnName').style.color = players[current].color;
    document.getElementById('diceVal').textContent = diceValue || '-';
    document.getElementById('moveHint').textContent =
      (phase === 'awaitRoll') ? '尚未掷骰子'
      : (phase === 'acting') ? `剩余步数：${moveLeft}`
      : '攻击模式中';
    document.getElementById('rollBtn').disabled = (phase !== 'awaitRoll' || gameOver);
    document.getElementById('digBtn').disabled = (phase !== 'acting' || gameOver);
    document.getElementById('buyBtn').disabled = (phase !== 'acting' || gameOver);
    document.getElementById('attackBtn').disabled = (phase !== 'acting' && phase !== 'attack') || gameOver;
    document.getElementById('endBtn').disabled = gameOver;
    document.getElementById('attackBar').classList.toggle('show', phase === 'attack');

    // 攻击模式的武器选择
    const wp = document.getElementById('wepBtns');
    wp.innerHTML = '';
    if (phase === 'attack') {
      const p = players[current];
      WEAPONS.forEach((w, i) => {
        if (p.weapons[i] <= 0) return;
        const b = document.createElement('button');
        b.className = 'wep-btn' + (i === selectedWeapon ? ' sel' : '');
        b.textContent = `${w.name}(距${w.range} 攻${w.dmg}) ×${p.weapons[i]}`;
        b.onclick = () => selectWeapon(i);
        wp.appendChild(b);
      });
    }
  }

  // ---------- 购买弹窗 ----------
  function openShop() {
    if (gameOver || phase !== 'acting') return;
    const p = players[current];
    document.getElementById('buyTitle').textContent = `${p.name} 的商店（当前货币 ${p.money} 万）`;
    const list = document.getElementById('shopList');
    list.innerHTML = '';
    WEAPONS.forEach((w, i) => {
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `
        <span class="name">${w.name}</span>
        <span class="meta">攻击距离 ${w.range} 格 · 攻击力 ${w.dmg} · 一次性</span>
        <span class="owned">已拥有 ×${p.weapons[i]}</span>
        <span class="cost">${w.cost} 万</span>
        <button class="btn" ${p.money < w.cost ? 'disabled' : ''} onclick="window._buyW(${i})">购买</button>
      `;
      list.appendChild(item);
    });
    const bread = document.createElement('div');
    bread.className = 'shop-item';
    bread.innerHTML = `
      <span class="name">面包</span>
      <span class="meta">恢复 2 点行动力</span>
      <span class="cost">1 万</span>
      <button class="btn" ${p.money < BREAD.cost ? 'disabled' : ''} onclick="window._buyB()">购买</button>
    `;
    list.appendChild(bread);
    const heal = document.createElement('div');
    heal.className = 'shop-item';
    const healFull = p.hp >= HEAL.max;
    const healLimit = p.healBuys >= HEAL.perTurn;
    heal.innerHTML = `
      <span class="name">生命之泉</span>
      <span class="meta">恢复 1 点生命值（最多 ${HEAL.max}）· 每回合限购 ${HEAL.perTurn} 次</span>
      <span class="owned">本回合已购 ${p.healBuys}/${HEAL.perTurn}</span>
      <span class="cost">${HEAL.cost} 万</span>
      <button class="btn" ${(p.money < HEAL.cost || healFull || healLimit) ? 'disabled' : ''} onclick="window._buyHeal()">购买</button>
    `;
    list.appendChild(heal);
    document.getElementById('buyModal').classList.remove('hidden');
  }

  // ---------- 更新日志 ----------
  function openChangelog() {
    const list = document.getElementById('changelogList');
    list.innerHTML = '';
    CHANGELOG.forEach(c => {
      const v = document.createElement('div');
      v.className = 'chg-ver';
      v.textContent = c.version + ' · ' + c.title;
      const d = document.createElement('span');
      d.className = 'chg-date';
      d.textContent = '（' + c.date + '）';
      v.appendChild(d);
      list.appendChild(v);
      const ul = document.createElement('ul');
      ul.className = 'chg-list';
      c.items.forEach(it => {
        const li = document.createElement('li');
        li.textContent = it;
        ul.appendChild(li);
      });
      list.appendChild(ul);
    });
    document.getElementById('changelogModal').classList.remove('hidden');
  }

  // ---------- 事件绑定 ----------
  document.getElementById('rollBtn').onclick = roll;
  document.getElementById('digBtn').onclick = dig;
  document.getElementById('buyBtn').onclick = openShop;
  document.getElementById('attackBtn').onclick = toggleAttack;
  document.getElementById('endBtn').onclick = endTurn;
  document.getElementById('cancelAttack').onclick = () => { phase = 'acting'; render(); };
  document.getElementById('closeBuy').onclick = () => document.getElementById('buyModal').classList.add('hidden');
  document.getElementById('changelogBtn').onclick = openChangelog;
  document.getElementById('closeChangelog').onclick = () => document.getElementById('changelogModal').classList.add('hidden');
  document.getElementById('restartBtn').onclick = () => location.reload();

  // 暴露给内联 onclick
  window._buyW = buyWeapon;
  window._buyB = buyBread;
  window._buyHeal = buyHeal;

  // 点击画布：移动 / 攻击
  canvas.addEventListener('click', e => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const gx = Math.floor(mx / CELL), gy = Math.floor(my / CELL);
    if (gx < 0 || gx >= W || gy < 0 || gy >= H) return;
    const p = players[current];
    if (phase === 'acting') {
      moveTo(gx, gy);
    } else if (phase === 'attack') {
      const target = players.find(q => q.alive && q !== p && q.x === gx && q.y === gy);
      if (target) doAttack(target);
      else { log('请点击一个敌人'); }
    }
  });

  // 键盘移动（方向键）
  window.addEventListener('keydown', e => {
    if (gameOver || phase !== 'acting') return;
    const p = players[current];
    const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] };
    const d = map[e.key];
    if (d) {
      e.preventDefault();
      moveTo(p.x + d[0], p.y + d[1]);
    }
  });

  // 图例
  function renderLegend() {
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    const legItems = [
      { label: '海洋（低概率）', color: OCEAN },
      { label: '中央岛屿（中概率）', color: ISLAND },
      ...players.map(p => ({ label: p.name + ' 出生地（高概率）', color: p.color })),
      { label: '已挖过的格子', color: '#0b1220' },
    ];
    legItems.forEach(it => {
      const s = document.createElement('span');
      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = it.color;
      s.appendChild(sw);
      s.appendChild(document.createTextNode(it.label));
      legend.appendChild(s);
    });
  }

  // ---------- 初始化 ----------
  let playerCount = 4;
  document.getElementById('verLabel').textContent = 'v' + VERSION;
  render();   // 先渲染出棋盘，等待玩家点击“开始游戏”

  // 玩家数量选择
  document.getElementById('playerSelect').querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      playerCount = parseInt(btn.dataset.n, 10);
      document.getElementById('playerSelect').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === btn));
      setupPlayers(playerCount);
      render();
    };
  });

  // 开始游戏
  document.getElementById('startBtn').onclick = () => {
    ensureAudio();
    sfx('start');
    document.getElementById('startOverlay').classList.add('hidden');
    // 开局坠落动画
    const intro = document.getElementById('introOverlay');
    document.getElementById('introFaller').style.background = players[0].color;
    document.getElementById('introFaller').style.borderColor = players[0].dark;
    intro.classList.remove('hidden');
    intro.classList.remove('play');
    void intro.offsetWidth;
    intro.classList.add('play');
    setTimeout(() => {
      intro.classList.add('hidden');
      setupPlayers(playerCount);
      current = 0;
      gameOver = false;
      winner = null;
      phase = 'awaitRoll';
      diceValue = 0;
      moveLeft = 0;
      selectedWeapon = 0;
      log('游戏开始！按顺时针依次行动：' + players.map(p => p.name).join(' → '));
      startTurn();
    }, 1400);
  };
})();
</script>
</body>
